# Local hooks only: they use the project's locked toolchain (no network at commit time).
# Install once with: uv run pre-commit install --install-hooks -t pre-commit -t pre-push
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict src
        entry: uv run mypy --strict src
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest -q
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

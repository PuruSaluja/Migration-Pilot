[project]
name = "mpilot"
version = "0.1.0"
description = "Autonomous dependency-migration agent: the project's own tests are the judge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "typer",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "jinja2",
    "docker",
    "claude-agent-sdk",
    "anthropic",
    "tree-sitter",
    "tree-sitter-language-pack",
    "networkx",
    "githubkit",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "pyyaml",
    "httpx",
    "jsonschema>=4.26.0",
    "pathspec>=1.1",
    "packaging>=24",
]

[project.scripts]
mpilot = "mpilot.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "syrupy",
    "hypothesis",
    "respx",
    "pre-commit",
    "types-pyyaml",
    "types-docker>=7.2.0.20261102",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpilot"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Docs hold illustrative code blocks; ruff must not reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF", "PT", "C4", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105", "S106"]  # S103: tests set exact file modes
# Docker test modules import their fixtures from docker_helpers by name.
"tests/unit/test_docker_driver.py" = ["S101", "S103", "S105", "S106", "F811"]
"tests/unit/test_sandbox_freeze.py" = ["S101", "S103", "S105", "S106", "F811"]
"tests/unit/test_sandbox_export.py" = ["S101", "S103", "S105", "S106", "F811"]
"tests/unit/test_sandbox_disk.py" = ["S101", "S103", "S105", "S106", "S108", "F811"]  # S108: /tmp inside the container
# Detection tests are tables of fake repo files; their lines are data, not prose.
"tests/unit/test_detect_python.py" = ["S101", "S103", "S105", "S106", "E501"]
"tests/unit/test_detect_python_docker.py" = ["S101", "S103", "S105", "S106", "S108", "F811", "E501"]
"tests/unit/test_install_docker.py" = ["S101", "S103", "S105", "S106", "S108", "F811"]
"tests/unit/test_network_docker.py" = ["S101", "S103", "S105", "S106", "F811"]
"tests/unit/test_cache_docker.py" = ["S101", "S103", "S105", "S106", "S108", "F811"]  # S108: /tmp inside the container
"tests/unit/test_images_docker.py" = ["S101", "S103", "S105", "S106", "S108", "F811"]  # S108: /tmp inside the container
# Alembic revisions are generated, frozen snapshots; long constraint strings stay as emitted.
"src/mpilot/models/migrations/versions/*.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
packages = ["mpilot"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The E1 policy plugin registers the markers and enforces the skip rules
# (docs/decisions.md E1): Docker tests fail without Docker unless
# MPILOT_SKIP_DOCKER=1, network tests need MPILOT_NETWORK_TESTS=1, e2e is
# deselected unless selected with -m.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "mpilot.testing.policy", "-p", "pytester"]
markers = [
    "docker: needs a working Docker daemon; fails (not skips) without one unless MPILOT_SKIP_DOCKER=1",
    "network: downloads from registries; runs only with MPILOT_NETWORK_TESTS=1",
    "e2e: real Claude calls; deselected unless selected with -m e2e, owner-triggered only",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/mpilot"]
branch = true

[tool.coverage.report]
show_missing = true
